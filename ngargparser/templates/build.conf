# Build configuration (optional).
# Copy this file and adjust for your tool. If missing, build.sh uses generic defaults.
# All values are optional; unset or empty means "use default".
#
# This file lives in scripts/core/ next to build.sh, but it is USER-OWNED: it is the
# one file in scripts/core/ that `cli sync` never overwrites. Tool-specific build
# settings belong here, not in build.sh (which is framework-owned and gets
# overwritten on sync).
#
# build.sh copies the tool folder into build/<TOOL>-<VERSION>/. Symlinks are copied as
# links, never followed, and must be relative and stay inside the build.

# Tarball filename prefix. Empty falls back to IEDB_, the prefix the deploy orchestrator expects.
TARBALL_PREFIX="IEDB_"
