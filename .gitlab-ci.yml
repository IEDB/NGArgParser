# CI for ngargparser. Uses uv to provision the dev dependency group
# (ruff/mypy/pytest) declared in pyproject.toml.
#
# GitLab sets CI=1 automatically, which disables the update notifier.
# NGARGPARSER_NO_SELF_UPGRADE guards against any test path triggering a
# self-upgrade + re-exec.

stages:
  - lint
  - typecheck
  - test

variables:
  NGARGPARSER_NO_SELF_UPGRADE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# No `cache:` here on purpose: the GitLab cache server (gitlab-cache.lji.org)
# isn't reachable from these runners, so caching only produces noisy upload
# failures. `uv sync` re-resolves deps each run instead.
default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv
    - uv sync

ruff:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

mypy:
  stage: typecheck
  script:
    - uv run mypy

pytest:
  stage: test
  image: "python:$PYVER-slim"
  parallel:
    matrix:
      - PYVER: ["3.9", "3.11", "3.12"]
  script:
    - uv run pytest
