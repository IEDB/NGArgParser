[project]
name = "ngargparser"
version = "0.5.0"
description = "Standardized parser framework for CLI tools. Enforces structure for argument parsing, project scaffolding, dependency wiring, and build packaging across IEDB next-gen apps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["iedb", "nextgen", "argumentparser", "iedb tools"]
dependencies = [
    "python-dotenv>=0.19.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://gitlab.lji.org/iedb/tools/tools-redesign/global-dependencies/ngargparser"

[project.scripts]
cli = "ngargparser.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    # mypy 2 cannot check for Python 3.9 ([tool.mypy] python_version below):
    # it warns and checks for 3.10 instead.
    "mypy>=1.10,<2",
    # tests/test_build_ci_template.py parses the generated .gitlab-ci.yml.
    "pyyaml>=6",
    # The build's lock check reads TOML; Python 3.11+ has tomllib built in.
    "tomli>=1.1; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ngargparser", "ngargparser.templates"]

[tool.setuptools.package-data]
"ngargparser.templates" = ["*", "example-app/*", "deploy/*"]
"ngargparser" = ["license-LJI.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"

# NGArgumentParser.py, NGChildArgumentParser.py, validators.py, and templates/
# are scaffold payload: they are copied into generated projects and use
# `core.*` imports that only resolve there, so lint/typecheck must skip them.
[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [
    "ngargparser/templates",
    "ngargparser/NGArgumentParser.py",
    "ngargparser/NGChildArgumentParser.py",
    "ngargparser/validators.py",
    "build",
    "test",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
# The oldest Python ngargparser supports, so 3.10+ syntax is caught here too.
python_version = "3.9"
files = [
    "ngargparser/cli.py",
    "ngargparser/core_validators.py",
    "ngargparser/result_writer.py",
    "ngargparser/app_env.py",
    "ngargparser/NGArgumentParser.py",
    "ngargparser/NGChildArgumentParser.py",
    # Listed by name: `exclude` below only skips files mypy finds on its own.
    "ngargparser/templates/configure.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = '(^|/)(templates|build|test)/'

# pytest drops Python 3.9 before ngargparser does: where uv installs a newer
# pytest (on Python 3.10+), its own code uses syntax 3.9 lacks, which mypy,
# checking for 3.9, cannot read. Its types are left out (Any) instead.
[[tool.mypy.overrides]]
module = ["pytest", "_pytest.*"]
follow_imports = "skip"
